# Hand-placed from bagdock/bagdock-cli's homebrew-sync.yml (BDOK-1232). The
# sync App is granted contents:write only (no workflows:write), so this file
# is not synced automatically and must be updated here directly if it
# changes.
#
# Purpose: auto-close source pull requests with a friendly redirect. Issues
# stay open; only PRs are closed, since this repo cannot accept source
# changes.
#
# `pull_request_target` is used deliberately so this workflow runs with repo
# permissions even on PRs opened from forks. The script below does not check
# out or run any code from the PR, so this is a safe use of
# pull_request_target.

name: Auto-close pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  autoclose:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              "Thanks for the interest. This tap is a generated, one-way mirror of the Bagdock CLI's release metadata, and its source of truth is bagdock/bagdock-cli, so pull requests here cannot be merged.",
              "Please open an Issue instead if this is a bug report or feature request, and it will be triaged from there.",
              "Closing this PR now, but we appreciate you taking the time.",
            ].join(" ");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed",
            });
